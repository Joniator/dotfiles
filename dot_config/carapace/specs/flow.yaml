# carapace spec for the `flow` command.
#
# Applies to bash, zsh, nu, fish, etc. via the carapace init in each shell.
# See https://carapace.sh/ for the spec format.
#
# Keep this file in lockstep with the `def "main ..."` dispatchers in
# ~/.local/bin/flow. When you add a new subcommand there, mirror it here.

name: flow
description: dev workflow helper
commands:
  - name: chezmoi
    description: chezmoi helpers
    commands:
      - name: origin-to-ssh
        description: rewrite dotfiles remote to ssh
      - name: update
        description: weekly refresh + regenerate vendor autoloads
        flags:
          --force: bypass the weekly rate limit

  - name: dev
    description: day-to-day dev flows
    commands:
      - name: start
        description: start a new feature branch off latest main

  - name: edit
    description: chezmoi edit a config subtree
    commands:
      - name: zsh
        description: edit ~/.config/zsh and re-exec zsh
      - name: nvim
        description: edit ~/.config/nvim
      - name: nu
        description: edit ~/.config/nushell and re-exec nu
      - name: mise
        description: edit ~/.config/mise/config.toml

  - name: git
    description: git flows
    commands:
      - name: branch
        description: fuzzy-checkout a local branch
      - name: commit
        description: stage-all and commit with a prompted message
      - name: wip
        description: quick WIP commit (git add -A; git commit -m wip)

  - name: net
    description: network utilities
    commands:
      - name: ip
        description: print the public IP address

  - name: nvim
    description: neovim maintenance
    commands:
      - name: update
        description: headless Lazy sync + re-add lockfile to chezmoi

  - name: oc
    description: openshift flows
    commands:
      - name: project
        description: switch project (fuzzy if no name given)
        completion:
          positional:
            - ["$(oc get projects -o name 2>/dev/null | sed 's|.*/||')"]
      - name: pods
        description: list pods in current project as a table

  - name: review
    description: code review flows
    commands:
      - name: diff
        description: render staged diff as markdown, optionally summarize with mods
